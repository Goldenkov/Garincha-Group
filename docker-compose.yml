services:
  db:
    image: postgis/postgis:16-3.4
    container_name: gg-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gg_territory
    ports:
      - "5432:5432"
    volumes:
      - gg_db_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d/01-migrations:ro
      - ./supabase/seed:/docker-entrypoint-initdb.d/02-seed:ro

  web:
    build:
      context: ./apps/web
    container_name: gg-web
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  gg_db_data:
